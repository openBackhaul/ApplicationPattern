                                    from {$CreatingDsfpOutputCausesFilteringAndClusteringInputData.PrepInputData.response.body#list-of-filtered-ethernet-containers/filtered-historical-performance-data/jabber-frames-ingress}'
                                unknown-protocol-frames-input:
