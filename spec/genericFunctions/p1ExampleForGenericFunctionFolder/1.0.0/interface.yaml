      CreatingDsfpOutputCausesReadingMostRecentTimestampsForDeviceInterfacesFromDeviceTable:
        GetTimestamps: #[dpmdpIpAddress]:[dpmdpPort]/dpmdp-internal-memory:deviceTable]
          description: >
            'The DPMDP keeps an internal deviceTable, where it stores for every device, which interfaces it has seen before.
            For each interface there is a timestamp indicating the most recent timestamp that was seen in historical PM data from the last data retrieval for that interface.
            The list of these timestamps is read here for the given device'
          get:
            requestBody:
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      mount-name:
                        type: string
                        description: >
                          'The mount-name of the device
                          from {$requst.body#mount-name}'
            responses:
              '200':
                description: 'List of most recent PM data timestamps for the devices interfaces provided'
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        uuid:
                          type: string
                          description: 'The uuid of the LTP'
                        local-id:
                          type: string
                          description: 'The local-id of the LTP, which together with the uuid forms the lookup key for the interfaces'
                        most-recent-timestamp:
                          type: string
                          description: 'The most recent timestamp for this interface seen in previous retrievals'
                    example:
                      uuid: '2146697744'
                      local-id: 'RF-2146697744'
                      most-recent-timestamp: '2024-03-07T00:15:00.0+00:00'
      CreatingDsfpOutputCausesFilteringAndClusteringInputData:
        PrepInputData: #[dpmdpIpAddress]:[dpmdpPort]/[dpmdp-internal-memory]
          description: >
            'The input data from {$CreatingDsfpOutputCausesReadingControlConstructFromCache.ReadCc.response.body} is to be traversed
            and prepared for subsequent processing steps'
          get:
            responses:
              '200':
                description: 'Input CC data filtered and clustered'
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        ltp-structure-and-augment:
                          description: >
                            'The control-construct data from {$CreatingDsfpOutputCausesReadingControlConstructFromCache.ReadCc.response.body}
                              is to be traversed, the encountered ltp-structure and augment information are to be written into this array, there is no filtering.'
                          type: array
                          items:
                            type: object
                            properties:
                              logical-termination-point:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    uuid:
                                      type: string
                                      description: >
