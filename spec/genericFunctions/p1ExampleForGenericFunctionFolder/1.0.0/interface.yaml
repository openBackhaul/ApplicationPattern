                                    from {$CreatingDsfpOutputCausesFilteringAndClusteringInputData.PrepInputData.response.body#list-of-filtered-ethernet-containers/filtered-historical-performance-data/errored-frames-input}'
                                errored-frames-output:
                                  type: integer
                                  nullable: true
                                  description: > 
